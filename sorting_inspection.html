<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>선별 검사</title>
<meta name="theme-color" content="#1F2A3C">
<style>
:root{--bg:#EEF1F5;--sur:#fff;--ink:#1C2530;--muted:#7C8798;--line:#DDE2E9;--primary:#1F2A3C;--accent:#F5A623;--ok:#1E9E5A;--ok-bg:#E7F7EE;--ng:#D64545;--ng-bg:#FDEBEB;--warn:#C97A00;--warn-bg:#FFF3D6;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Malgun Gothic',system-ui,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:900px;margin:0 auto;position:relative;overflow:hidden}
header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
header .t{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#5B6B85}.dot.on{background:#3ED17E}.dot.pend{background:var(--accent)}
.badge{background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:14px}
nav{display:flex;background:#fff;border-top:1px solid var(--line);flex-shrink:0}
nav button{flex:1;background:none;border:none;padding:10px 4px;font-size:12px;font-weight:700;color:var(--muted);min-height:58px;font-family:inherit}
nav button .ic{display:block;font-size:20px}
nav button.active{color:#5A3B00}
nav button.active .ic{color:var(--accent)}
.card{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
label.l{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:8px 0 4px}
input[type=text],input[type=url],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#FAFBFC;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:#fff}
.btn{padding:11px 16px;border:none;border-radius:10px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
.btn-p{background:var(--accent);color:#5A3B00}.btn-o{background:#fff;border:1.5px solid var(--line);color:var(--primary)}.btn-d{background:#fff;border:1.5px solid var(--ng);color:var(--ng)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.help{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cfgbox{border:1px solid var(--line);border-radius:10px;padding:8px;background:#FAFBFC}
.cfgbox b{font-size:13px}
.cfgbox input{padding:6px;font-size:14px;margin-top:4px}
/* result */
#result{border-radius:var(--r);padding:22px 14px;text-align:center;border:2.5px solid var(--line);background:#fff;margin-bottom:12px;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:6px}
#result .big{font-size:44px;font-weight:900;line-height:1.1}
#result .sn{font-family:Consolas,monospace;font-size:20px;font-weight:700;word-break:break-all}
#result .sub{font-size:13px;color:var(--muted)}
#result.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
#result.ng{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
#result.dup{background:var(--warn-bg);border-color:var(--accent);color:var(--warn)}
#result.ok .sub,#result.ng .sub,#result.dup .sub{color:inherit;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:26px;line-height:1.1}.stat span{font-size:11px;color:var(--muted);font-weight:700}
.stat.ok b{color:var(--ok)}.stat.ng b{color:var(--ng)}
.bar{height:12px;background:#EDEFF2;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#FFC15E);transition:width .3s}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#F5F6F8;color:var(--muted);text-align:left;padding:8px 10px;white-space:nowrap;border-bottom:1.5px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
.mono{font-family:Consolas,monospace;font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.ng{background:var(--ng-bg);color:var(--ng)}.tag.un{background:var(--warn-bg);color:var(--warn)}
#toast{position:absolute;top:58px;left:12px;right:12px;z-index:20;display:none;padding:12px;border-radius:12px;font-weight:700;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#toast.success{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
#toast.danger{background:var(--ng-bg);color:var(--ng);border:1.5px solid var(--ng)}
#toast.info{background:#EAF1FB;color:#2560B0;border:1.5px solid #2560B0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-top:8px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
pre{background:#0f172a;color:#cbd5e1;padding:10px;border-radius:8px;font-size:11px;overflow:auto;max-height:260px}
details summary{cursor:pointer;font-weight:700;font-size:13px}
.preview{background:#0f172a;border-radius:8px;padding:10px;font-family:Consolas,monospace;font-size:14px;word-break:break-all;margin-top:8px;color:#64748b}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="t"><span class="dot" id="dot"></span>선별 검사</div>
    <div class="badge" id="wbadge">작업자 미설정</div>
  </header>
  <div id="toast"></div>
  <main id="main"></main>
  <nav>
    <button data-tab="setup"><span class="ic">⚙</span>설정</button>
    <button data-tab="scan"><span class="ic">🔍</span>검사</button>
    <button data-tab="status"><span class="ic">📊</span>현황</button>
  </nav>
</div>

<script>
/* ================= 상태 ================= */
const KEY='sorting_inspection_v1';
const DEF_CFG={pn:{p:12,l:10},ser:{p:68,l:10},alc:{p:23,l:4},mfg:{p:35,l:6}};
function defState(){return{worker:'',gasUrl:'',cfg:JSON.parse(JSON.stringify(DEF_CFG)),ref:[],records:[],lastSync:null,keepFocus:true,lastRes:null}}
let S=(()=>{try{return Object.assign(defState(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return defState()}})();
function save(){localStorage.setItem(KEY,JSON.stringify(S))}

/* 중복/기준 조회용 인덱스 (Map/Set → O(1)) */
let refMap=new Map(), seenSet=new Set();
function rebuild(){
  refMap=new Map(S.ref.map(r=>[r.serial,r.partNo]));
  seenSet=new Set(S.records.map(r=>r.serial));
}
rebuild();

let tab='scan', syncing=false;
let fStatus='all', fWorker='', fSearch='';

/* ================= 유틸 ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=ts=>new Date(ts).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
function toast(type,msg,ms){const e=$('toast');e.className=type;e.textContent=msg;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms||2200)}
function beep(ok){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:220;g.gain.value=.15;o.start();o.stop(c.currentTime+(ok?.1:.4))}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ================= 바코드 파싱 (MES 참고) ================= */
function normBC(raw){return String(raw||'').replace(/\x84/g,'').replace(/[\x00-\x09\x0b\x0c\x0e-\x1f\x7f]/g,' ')}
const sub=(s,p,l)=>(s||'').substring(p-1,p-1+l).replace(/ /g,'').trim();
function parseBC(raw){
  const n=normBC(raw), c=S.cfg;
  const partNo=sub(n,c.pn.p,c.pn.l), serial=sub(n,c.ser.p,c.ser.l);
  if(!partNo||!serial) return null;
  return{partNo:partNo.toUpperCase(),serial:serial.toUpperCase(),alc:sub(n,c.alc.p,c.alc.l),mfg:sub(n,c.mfg.p,c.mfg.l)};
}

/* ================= 검사 처리 ================= */
function handleScan(raw){
  raw=String(raw||'').trim(); if(!raw) return;
  if(!S.worker){toast('danger','설정에서 작업자 이름을 입력하세요.');return}
  const p=parseBC(raw);
  if(!p){return showRes('ng','파싱 실패','바코드 형식/설정 확인',raw.slice(0,40))}
  if(seenSet.has(p.serial)){
    const prev=S.records.find(r=>r.serial===p.serial);
    beep(false);vib([80,60,80]);
    return showRes('dup','중복 스캔',p.serial,prev?`이미 검사됨: ${prev.worker} / ${fmt(prev.ts)} / ${prev.result}`:'이미 검사됨');
  }
  let result='비대상',why='기준 정보에 없음';
  if(!S.ref.length){why='기준 정보 미등록'}
  else if(refMap.has(p.serial)){
    if(refMap.get(p.serial)===p.partNo){result='대상';why='기준 일치'}
    else why=`품번 상이 (기준 ${refMap.get(p.serial)})`;
  }
  const rec={id:uid(),worker:S.worker,partNo:p.partNo,serial:p.serial,alc:p.alc,mfg:p.mfg,result,ts:Date.now(),synced:false};
  S.records.push(rec);seenSet.add(rec.serial);S.lastRes={rec,why};save();
  beep(result==='대상');vib(result==='대상'?60:[200,80,200]);
  showRes(result==='대상'?'ok':'ng',result,p.serial,`${p.partNo} · ${why}`);
  pushOne(rec);
  refreshStats();
}
function showRes(cls,big,sn,sub){
  const el=$('result'); if(!el) return;
  el.className=cls;el.innerHTML=`<div class="big">${esc(big)}</div><div class="sn">${esc(sn)}</div><div class="sub">${esc(sub)}</div>`;
}

/* ================= 집계 ================= */
function stats(){
  const tgt=S.records.filter(r=>r.result==='대상').length;
  const non=S.records.length-tgt;
  const total=S.ref.length;
  return{total,tgt,non,left:Math.max(0,total-tgt),pct:total?Math.min(100,Math.round(tgt/total*100)):0};
}
function refreshStats(){const e=$('statsBox');if(e)e.innerHTML=statsHtml();renderHeader()}
function statsHtml(){
  const s=stats();
  return`<div class="stats">
    <div class="stat ok"><b>${s.tgt}</b><span>대상</span></div>
    <div class="stat ng"><b>${s.non}</b><span>비대상</span></div>
    <div class="stat"><b>${s.total?s.left:'-'}</b><span>미검사</span></div></div>`;
}

/* ================= 화면 ================= */
function renderHeader(){
  $('wbadge').textContent=S.worker||'작업자 미설정';
  const un=S.records.some(r=>!r.synced);
  $('dot').className='dot'+(S.gasUrl?(un?' pend':' on'):'');
}
function renderScan(){
  const lr=S.lastRes;
  return`<div id="statsBox">${statsHtml()}</div>
  <div id="result" class="${lr?(lr.rec.result==='대상'?'ok':'ng'):''}">${lr?`<div class="big">${esc(lr.rec.result)}</div><div class="sn">${esc(lr.rec.serial)}</div><div class="sub">${esc(lr.rec.partNo)} · ${esc(lr.why)}</div>`:`<div class="big" style="color:var(--muted);font-size:26px">바코드를 스캔하세요</div>`}</div>
  <div class="card">
    <label class="l" style="margin-top:0">바코드 입력 (스캐너 / 직접 입력 후 Enter)</label>
    <div class="row"><input type="text" id="scanIn" autocomplete="off" autocapitalize="off" spellcheck="false" ${S.keepFocus?'inputmode="none"':''} placeholder="스캔 대기 중">
    <button class="btn btn-p" style="flex:0 0 80px" onclick="submitIn()">확인</button></div>
    <label class="chk"><input type="checkbox" ${S.keepFocus?'checked':''} onchange="S.keepFocus=this.checked;save();render()">스캐너 모드 (화면 키보드 숨김, 입력창 자동 포커스)</label>
  </div>`;
}
function submitIn(){const i=$('scanIn');const v=i.value;i.value='';handleScan(v);if(S.keepFocus)i.focus()}

function renderStatus(){
  const s=stats();
  const workers=[...new Set(S.records.map(r=>r.worker))].sort();
  const agg={};S.records.forEach(r=>{const a=agg[r.worker]||(agg[r.worker]={t:0,n:0,first:r.ts,last:r.ts});r.result==='대상'?a.t++:a.n++;a.first=Math.min(a.first,r.ts);a.last=Math.max(a.last,r.ts)});
  const q=fSearch.toUpperCase();
  const list=S.records.filter(r=>(fStatus==='all'||r.result===fStatus)&&(!fWorker||r.worker===fWorker)&&(!q||(r.serial+r.partNo).includes(q))).sort((a,b)=>b.ts-a.ts);
  const shown=list.slice(0,200);
  const unsynced=S.records.filter(r=>!r.synced).length;
  return`<div class="card">
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">진행 현황</h3>
      <button class="btn btn-o" style="flex:0 0 auto;padding:7px 12px" onclick="syncNow()">${syncing?'동기화 중...':'🔄 동기화'}</button></div>
    <div class="help">${S.gasUrl?(S.lastSync?`마지막 동기화: ${fmt(S.lastSync)}`:'아직 동기화 안 됨')+(unsynced?` · 미전송 ${unsynced}건`:''):'연동 URL 미설정 — 이 기기 기록만 표시'}</div>
    <div style="font-size:34px;font-weight:900;margin-top:8px">${s.tgt}<span style="font-size:16px;color:var(--muted)">${s.total?` / ${s.total}건 (${s.pct}%)`:' 건 (기준 미등록)'}</span></div>
    ${s.total?`<div class="bar"><i style="width:${s.pct}%"></i></div>`:''}
    <div class="stats" style="margin:12px 0 0"><div class="stat ok"><b>${s.tgt}</b><span>대상</span></div><div class="stat ng"><b>${s.non}</b><span>비대상</span></div><div class="stat"><b>${s.total?s.left:'-'}</b><span>미검사</span></div></div>
  </div>
  <div class="card"><h3>작업자별 집계</h3><div class="tw"><table><thead><tr><th>작업자</th><th>대상</th><th>비대상</th><th>시작</th><th>마지막</th></tr></thead><tbody>
  ${Object.keys(agg).sort().map(w=>`<tr><td>${esc(w)}</td><td>${agg[w].t}</td><td>${agg[w].n}</td><td>${fmt(agg[w].first)}</td><td>${fmt(agg[w].last)}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:18px">기록 없음</td></tr>'}
  </tbody></table></div></div>
  <div class="card"><h3>검사 리스트 (${list.length}건)</h3>
    <div class="grid2" style="margin-bottom:8px">
      <select onchange="fStatus=this.value;render()"><option value="all">전체</option><option value="대상" ${fStatus==='대상'?'selected':''}>대상</option><option value="비대상" ${fStatus==='비대상'?'selected':''}>비대상</option></select>
      <select onchange="fWorker=this.value;render()"><option value="">전체 작업자</option>${workers.map(w=>`<option ${fWorker===w?'selected':''}>${esc(w)}</option>`).join('')}</select></div>
    <input type="text" placeholder="시리얼/품번 검색" value="${esc(fSearch)}" oninput="fSearch=this.value;onSearch()" style="margin-bottom:8px">
    <div class="tw"><table><thead><tr><th>결과</th><th>시리얼</th><th>품번</th><th>작업자</th><th>시간</th><th></th></tr></thead><tbody id="recBody">${rowsHtml(shown)}</tbody></table></div>
    ${list.length>200?'<div class="help">최근 200건만 표시됩니다. 전체는 CSV로 내려받으세요.</div>':''}
    <button class="btn btn-o" style="width:100%;margin-top:10px" onclick="exportCSV()">📥 CSV 다운로드</button>
  </div>`;
}
function rowsHtml(l){return l.length?l.map(r=>`<tr><td><span class="tag ${r.result==='대상'?'ok':'ng'}">${r.result}</span>${r.synced?'':' <span class="tag un">미전송</span>'}</td><td class="mono">${esc(r.serial)}</td><td>${esc(r.partNo)}</td><td>${esc(r.worker)}</td><td>${fmt(r.ts)}</td><td><button class="btn btn-d" style="padding:3px 9px;font-size:12px" onclick="delRec('${r.id}')">삭제</button></td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:18px">기록 없음</td></tr>'}
function onSearch(){const q=fSearch.toUpperCase();const l=S.records.filter(r=>(fStatus==='all'||r.result===fStatus)&&(!fWorker||r.worker===fWorker)&&(!q||(r.serial+r.partNo).includes(q))).sort((a,b)=>b.ts-a.ts).slice(0,200);$('recBody').innerHTML=rowsHtml(l)}
function delRec(id){
  const r=S.records.find(x=>x.id===id);if(!r||!confirm(`삭제할까요?\n${r.serial} (${r.result})`))return;
  S.records=S.records.filter(x=>x.id!==id);rebuild();save();
  if(S.gasUrl)post({type:'del',id}).catch(()=>toast('danger','서버 삭제 실패 — 다음 동기화 시 되살아날 수 있음'));
  render();
}
function exportCSV(){
  const h=['결과','시리얼','품번','ALC','생산일','작업자','검사시각'];
  const rows=S.records.map(r=>[r.result,r.serial,r.partNo,r.alc,r.mfg,r.worker,new Date(r.ts).toLocaleString('ko-KR')]);
  const csv=[h,...rows].map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='선별검사_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

/* ---- 설정 ---- */
const FIELDS=[['pn','품번'],['ser','시리얼'],['alc','ALC'],['mfg','생산일']];
function renderSetup(){
  return`<div class="card"><h3>1. 작업자</h3><input type="text" id="inWorker" value="${esc(S.worker)}" placeholder="예) 홍길동"></div>
  <div class="card"><h3>2. 바코드 파싱 기준</h3>
    <div class="help" style="margin:0 0 8px">시작위치(1부터)와 문자길이. 아래 테스트 입력으로 확인하세요.</div>
    <div class="grid4">${FIELDS.map(([k,n])=>`<div class="cfgbox"><b>${n}</b><input type="number" min="1" id="c_${k}_p" value="${S.cfg[k].p}" oninput="onCfg()"><input type="number" min="1" id="c_${k}_l" value="${S.cfg[k].l}" oninput="onCfg()"></div>`).join('')}</div>
    <div class="help">각 칸: 위=시작위치, 아래=길이</div>
    <input type="text" id="testIn" placeholder="테스트용 바코드 입력/스캔" oninput="onCfg()" style="margin-top:8px">
    <div class="preview" id="prev">바코드를 입력하면 파싱 결과가 표시됩니다.</div>
    <div class="row" style="margin-top:10px"><button class="btn btn-p" onclick="saveCfg()">파싱 기준 저장</button><button class="btn btn-d" onclick="resetCfg()">초기화</button></div></div>
  <div class="card"><h3>3. 기준 정보 (대상 리스트)</h3>
    <div class="help" style="margin:0 0 8px">현재 ${S.ref.length}건 등록됨. CSV 파일 또는 붙여넣기: 한 줄에 <b>품번, 시리얼</b> (쉼표/탭/공백 구분, 헤더 자동 제외)</div>
    <input type="file" id="refFile" accept=".csv,.txt,.tsv" onchange="loadRefFile(this.files[0])">
    <textarea id="refText" rows="4" placeholder="99910CV800,1234567890" style="margin-top:8px"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn btn-p" onclick="applyRef(false)">추가/갱신</button><button class="btn btn-d" onclick="applyRef(true)">전체 교체</button></div></div>
  <div class="card"><h3>4. 다중 접속 동기화 (선택)</h3>
    <input type="url" id="inGas" value="${esc(S.gasUrl)}" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="help">여러 기기가 같은 URL을 쓰면 기록·기준정보·중복 체크가 공유됩니다. 비워두면 이 기기에서만 동작합니다.</div>
    <div class="row" style="margin-top:8px"><button class="btn btn-p" onclick="saveGas()">저장</button><button class="btn btn-o" onclick="syncNow()">지금 동기화</button><button class="btn btn-o" onclick="uploadRef()">기준정보 서버 업로드</button></div>
    <details style="margin-top:12px"><summary>Apps Script 코드 (복사해서 배포)</summary><pre id="gasCode"></pre>
    <div class="help">스프레드시트 &gt; 확장 프로그램 &gt; Apps Script에 붙여넣고 웹 앱으로 배포(액세스: 모든 사용자).</div></details></div>
  <div class="card" style="border-color:var(--ng)"><h3 style="color:var(--ng)">위험 구역</h3><button class="btn btn-d" style="width:100%" onclick="resetAll()">이 기기 데이터 전체 초기화</button></div>`;
}
function onCfg(){
  const c={};FIELDS.forEach(([k])=>{c[k]={p:Math.max(1,+$('c_'+k+'_p').value||1),l:Math.max(1,+$('c_'+k+'_l').value||1)}});
  const raw=$('testIn').value,pv=$('prev');
  if(!raw){pv.innerHTML='바코드를 입력하면 파싱 결과가 표시됩니다.';return}
  const n=normBC(raw);
  pv.innerHTML=FIELDS.map(([k,name])=>`<div><span style="color:#94a3b8">${name}:</span> <span style="color:#fbbf24">${esc(sub(n,c[k].p,c[k].l))||'(없음)'}</span></div>`).join('')+`<div style="color:#64748b;font-size:12px">(${n.length}자)</div>`;
}
function saveCfg(){
  FIELDS.forEach(([k])=>{S.cfg[k]={p:Math.max(1,+$('c_'+k+'_p').value||1),l:Math.max(1,+$('c_'+k+'_l').value||1)}});
  save();toast('success','파싱 기준이 저장되었습니다.');
}
function resetCfg(){
  if(!confirm('파싱 기준을 기본값으로 초기화할까요?'))return;
  S.cfg=JSON.parse(JSON.stringify(DEF_CFG));save();render();toast('success','파싱 기준이 초기화되었습니다.');
}
function loadRefFile(f){if(!f)return;const r=new FileReader();r.onload=e=>{$('refText').value=e.target.result;toast('info','파일을 읽었습니다. 추가/갱신 또는 전체 교체를 누르세요.')};r.readAsText(f,'UTF-8')}
function parseRefText(t){
  const out=[],seen=new Set();let skipped=0;
  t.split(/\r?\n/).forEach((ln,i)=>{
    const c=ln.split(/[,\t;]|\s+/).map(x=>x.replace(/^"|"$/g,'').trim()).filter(Boolean);
    if(c.length<2){if(ln.trim())skipped++;return}
    if(i===0&&/[가-힣]/.test(c[0]+c[1]))return;
    const partNo=c[0].toUpperCase(),serial=c[1].toUpperCase();
    if(seen.has(serial)){skipped++;return}
    seen.add(serial);out.push({partNo,serial});
  });
  return{out,skipped};
}
function applyRef(replace){
  const {out,skipped}=parseRefText($('refText').value);
  if(!out.length){toast('danger','등록할 데이터가 없습니다.');return}
  if(replace&&!confirm('기존 기준 정보를 모두 교체합니다. 계속할까요?'))return;
  const m=new Map(replace?[]:S.ref.map(r=>[r.serial,r]));out.forEach(r=>m.set(r.serial,r));
  S.ref=[...m.values()];rebuild();save();$('refText').value='';
  toast('success',`기준 정보 ${out.length}건 반영 (제외 ${skipped}건) · 총 ${S.ref.length}건`,3200);render();
}
function saveGas(){S.gasUrl=$('inGas').value.trim();save();toast('success','저장되었습니다.');renderHeader()}
function resetAll(){if(confirm('이 기기의 모든 데이터를 삭제합니다. 계속할까요?')){localStorage.removeItem(KEY);S=defState();rebuild();render()}}

/* ================= 동기화 (Apps Script) ================= */
function fetchT(url,opt,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||20000);return fetch(url,Object.assign({},opt,{signal:c.signal})).finally(()=>clearTimeout(t))}
function post(obj){return fetchT(S.gasUrl,{method:'POST',body:JSON.stringify(obj)}).then(r=>r.json())}
function pushOne(rec){
  if(!S.gasUrl)return;
  post({type:'scan',...rec}).then(d=>{
    if(d.result==='success'||d.result==='duplicate'){
      if(d.result==='duplicate'&&d.record&&d.record.id!==rec.id){ // 다른 기기가 먼저 검사함 → 내 기록 제거
        S.records=S.records.filter(x=>x.id!==rec.id);rebuild();
        toast('danger',`다른 기기에서 먼저 검사됨: ${rec.serial}`,3500);
      }else rec.synced=true;
      save();renderHeader();if(tab==='status')render();
    }
  }).catch(()=>{renderHeader()});
}
async function syncNow(){
  if(!S.gasUrl){toast('danger','연동 URL을 먼저 입력하세요.');return}
  if(syncing)return;syncing=true;if(tab==='status')render();
  try{
    for(const r of S.records.filter(x=>!x.synced)){
      const d=await post({type:'scan',...r});
      if(d.result==='success')r.synced=true;
      else if(d.result==='duplicate'){if(d.record&&d.record.id!==r.id)S.records=S.records.filter(x=>x.id!==r.id);else r.synced=true}
    }
    const res=await fetchT(S.gasUrl+'?action=list').then(r=>r.json());
    if(res.result==='error')throw new Error(res.message);
    const local=S.records.filter(r=>!r.synced);
    const server=(res.records||[]).map(r=>({...r,ts:+r.ts,synced:true}));
    const ids=new Set(server.map(r=>r.serial));
    S.records=server.concat(local.filter(r=>!ids.has(r.serial)));
    if(Array.isArray(res.ref)&&res.ref.length)S.ref=res.ref;
    S.lastSync=Date.now();rebuild();save();toast('success','동기화 완료');
  }catch(e){toast('danger','동기화 실패: '+(e.message||'오류'),4000)}
  syncing=false;render();
}
async function uploadRef(){
  if(!S.gasUrl){toast('danger','연동 URL을 먼저 입력하세요.');return}
  if(!S.ref.length){toast('danger','업로드할 기준 정보가 없습니다.');return}
  try{
    const CH=1000;
    for(let i=0;i<S.ref.length;i+=CH){
      const d=await post({type:'ref',replace:i===0,rows:S.ref.slice(i,i+CH)});
      if(d.result!=='success')throw new Error(d.message||'업로드 실패');
    }
    toast('success','기준 정보를 서버에 업로드했습니다.');
  }catch(e){toast('danger','업로드 실패: '+e.message,4000)}
}

/* ================= 렌더/이벤트 ================= */
function render(){
  renderHeader();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const m=$('main');
  m.innerHTML=tab==='scan'?renderScan():tab==='status'?renderStatus():renderSetup();
  if(tab==='scan'){
    const i=$('scanIn');
    i.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();submitIn()}});
    if(S.keepFocus){i.focus();i.addEventListener('blur',()=>setTimeout(()=>{if(tab==='scan'&&S.keepFocus&&!['TEXTAREA','SELECT'].includes(document.activeElement.tagName))i.focus()},150))}
  }
  if(tab==='setup'){
    $('inWorker').addEventListener('input',e=>{S.worker=e.target.value.trim();save();renderHeader()});
    $('gasCode').textContent=GAS_CODE;
  }
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();if(tab==='status'&&S.gasUrl)syncNow()});
window.addEventListener('online',()=>{if(S.gasUrl&&S.records.some(r=>!r.synced))syncNow()});

const GAS_CODE=`// Sheets: Records(id,worker,partNo,serial,alc,mfg,result,ts) / Ref(partNo,serial)
function sh_(n,h){var s=SpreadsheetApp.getActive(),x=s.getSheetByName(n);
  if(!x){x=s.insertSheet(n);x.appendRow(h)}return x}
function out_(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON)}
var RH=['id','worker','partNo','serial','alc','mfg','result','ts'];
function doGet(e){
  var r=sh_('Records',RH).getDataRange().getValues().slice(1).map(function(v){
    var o={};RH.forEach(function(k,i){o[k]=v[i]});return o});
  var f=sh_('Ref',['partNo','serial']).getDataRange().getValues().slice(1).map(function(v){
    return{partNo:String(v[0]),serial:String(v[1])}});
  return out_({result:'success',records:r,ref:f});
}
function doPost(e){
  var d=JSON.parse(e.postData.contents),lock=LockService.getScriptLock();lock.waitLock(20000);
  try{
    var s=sh_('Records',RH),vals=s.getDataRange().getValues();
    if(d.type=='scan'){
      for(var i=1;i<vals.length;i++){
        if(String(vals[i][3])==d.serial){
          var o={};RH.forEach(function(k,j){o[k]=vals[i][j]});
          return out_({result:'duplicate',record:o});
        }}
      s.appendRow(RH.map(function(k){return d[k]}));return out_({result:'success'});
    }
    if(d.type=='del'){
      for(var i=vals.length-1;i>=1;i--)if(vals[i][0]==d.id)s.deleteRow(i+1);
      return out_({result:'success'});
    }
    if(d.type=='ref'){
      var f=sh_('Ref',['partNo','serial']);
      if(d.replace&&f.getLastRow()>1)f.getRange(2,1,f.getLastRow()-1,2).clearContent();
      if(d.rows.length)f.getRange(f.getLastRow()+1,1,d.rows.length,2)
        .setValues(d.rows.map(function(r){return[r.partNo,r.serial]}));
      return out_({result:'success'});
    }
    return out_({result:'error',message:'unknown type'});
  }finally{lock.releaseLock()}
}`;

render();
if(S.gasUrl)syncNow();
</script>
</body>
